paths:
  /templates:
    get:
      summary: "Список templates"
      parameters:
        - name: limit (query, int, default=50)
        - name: offset (query, int, default=0)
      response: массив Template

    post:
      summary: "Создать template"
      body:
        name: string (required, min=1, max=100)
        description: string (опционально)
      response: Template

  /templates/{templateId}:
    get:
      summary: "Template по ID"
      param: templateId (int, in path)
      response: Template

    put:
      summary: "Обновить template"
      param: templateId (int, in path)
      body:
        name: string (omitempty, min=1, max=100)
        description: string (omitempty)
      response: Template

    delete:
      summary: "Удалить template"
      param: templateId (int, in path)
      response: { success: true }

components:
  schemas:
    Template:
      id: int
      name: string
      description: string
      created_at: datetime
      updated_at: datetime